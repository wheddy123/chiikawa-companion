<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiikawa Companion</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div id="bubble-container" class="bubble-container"></div>
    <div id="chat-container" class="chat-container hidden">
      <div class="chat-box">
        <div class="chat-header">
          <span class="chat-title">💬 Chat cùng Agent</span>
          <button id="chat-close" class="chat-close-btn" type="button">&times;</button>
        </div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Gõ prompt hoặc nói gì đó..." autocomplete="off" />
          <button id="chat-send" class="chat-send-btn" type="button">Gửi</button>
        </div>
      </div>
    </div>
    <div id="canvas-container" class="canvas-container"></div>
    <button id="chat-toggle-btn" class="chat-toggle-btn" type="button" title="Mở khung chat">💬</button>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
